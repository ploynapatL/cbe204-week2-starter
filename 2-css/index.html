<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox and Grid Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Flexbox and Grid Demo</h1>

    <section class="demo-section">
      <h2>Flexbox Example</h2>
      <p>This row of boxes is arranged using Flexbox.</p>
      <div class="flex-container">
        <div class="flex-item">
          Item 1 <br />
          New line
        </div>
        <div class="flex-item">
          Item 2 <br />
          New line
        </div>
        <div class="flex-item">Item 3</div>
        <!-- <div class="flex-item">Item 4</div>
        <div class="flex-item">Item 5</div> -->
      </div>
    </section>

    <section class="demo-section">
      <h2>Grid Example</h2>
      <p>This layout uses CSS Grid to place content into rows and columns.</p>
      <div class="grid-container">
        <div class="grid-item">Cell A</div>
        <div class="grid-item">Cell B</div>
        <div class="grid-item">Cell C</div>
        <div class="grid-item">Cell D</div>
        <div class="grid-item grid-item2">Cell E</div>
        <div class="grid-item grid-item3">Cell F</div>
      </div>
    </section>
  </body>
</html>
